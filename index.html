<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Rutina</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e1013">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1013; --card:#171a1f; --card2:#1e2229; --line:#2a2f37;
    --text:#eef1f4; --muted:#9aa3ae; --accent:#c8f03c; --accent-ink:#1a2100;
    --ok:#3ddc84;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  body{padding-bottom:110px}
  .wrap{max-width:560px;margin:0 auto;padding:16px}
  header h1{font-family:"Barlow Condensed",Inter,sans-serif;font-size:30px;margin:0;line-height:1;letter-spacing:.3px}
  .status{font-size:12px;color:var(--muted);margin-top:6px}
  .status b{color:var(--text);font-weight:600}
  .tabs{display:flex;background:var(--card);border-radius:12px;padding:4px;gap:4px;margin:16px 0}
  .tabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:10px;border-radius:9px;font:600 14px Inter,sans-serif;cursor:pointer}
  .tabs button.on{background:var(--card2);color:var(--text)}
  .hero{background:linear-gradient(135deg,#1c2410,#171a1f 70%);border:1px solid #2e3a17;border-radius:16px;padding:16px;margin-bottom:14px}
  .hero .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .hero .big{font-family:"Barlow Condensed";font-size:40px;line-height:1;margin:4px 0 2px}
  .hero .big span{color:var(--accent)}
  .hero .dname{font-size:16px;font-weight:600;margin-bottom:12px}
  .seg{display:inline-flex;background:#0e1013;border-radius:10px;padding:3px;gap:3px}
  .seg button{border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:8px;font:600 13px Inter;cursor:pointer}
  .seg button.on{background:var(--accent);color:var(--accent-ink)}
  .bar{height:8px;background:#0e1013;border-radius:99px;overflow:hidden;margin-top:14px}
  .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
  .prog{font-size:13px;color:var(--muted);margin-top:6px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
  .card.done{border-color:#24563a;background:#14201a}
  .chead{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer;user-select:none}
  .num{flex:none;width:34px;height:34px;border-radius:10px;background:var(--card2);display:grid;place-items:center;font:700 15px "Barlow Condensed";color:var(--muted)}
  .card.done .num{background:var(--ok);color:#06210f}
  .ctitle{flex:1;min-width:0}
  .ctitle .n{font-weight:600;font-size:15px}
  .ctitle .m{font-size:12.5px;color:var(--muted);margin-top:2px}
  .ctitle .last{font-size:12px;color:var(--accent);margin-top:3px}
  .chev{color:var(--muted);transition:transform .2s;flex:none}
  .card.open .chev{transform:rotate(180deg)}
  .cbody{display:none;padding:0 14px 14px}
  .card.open .cbody{display:block}
  .sub{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:12px 0 6px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid var(--line);background:var(--card2);color:var(--text);padding:7px 11px;border-radius:99px;font:500 13px Inter;cursor:pointer}
  .chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .demo{background:#0a0c0f;border:1px solid #20252c;border-radius:12px;margin-top:12px;padding:6px 6px 2px;position:relative}
  .demo svg{display:block;width:100%;height:auto;max-height:240px}
  .demo .cap{position:absolute;right:10px;bottom:6px;font-size:10.5px;color:#5d6672}
  .guide{background:var(--card2);border-radius:12px;padding:12px 12px 10px;margin-top:10px}
  .guide .mus{font-size:12px;color:var(--muted);margin-bottom:8px}
  .guide ol{margin:0;padding-left:20px}
  .guide li{font-size:14px;line-height:1.45;margin-bottom:6px}
  .tip{font-size:13px;line-height:1.4;color:#ffd79a;background:#2a2112;border-radius:8px;padding:8px 10px;margin-top:8px}
  .vid{display:inline-block;margin-top:10px;font-size:13px;color:var(--accent);text-decoration:none}
  .sets{width:100%;border-collapse:separate;border-spacing:0 6px;margin-top:4px}
  .sets th{font-size:11px;color:var(--muted);font-weight:500;text-align:left;padding:0 4px}
  .sets td{padding:0 4px}
  .sets .sn{font:700 15px "Barlow Condensed";color:var(--muted);width:28px}
  .sets input{width:100%;background:#0e1013;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px;font:600 16px Inter;text-align:center}
  .sets input:focus{outline:none;border-color:var(--accent)}
  .ck{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:#0e1013;color:var(--muted);font-size:18px;cursor:pointer}
  .ck.on{background:var(--ok);border-color:var(--ok);color:#06210f}
  .hint{font-size:12.5px;color:var(--muted);margin-top:4px}
  .up{font-size:13px;color:var(--ok);margin-top:6px}
  .btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font:600 15px Inter;cursor:pointer;margin-top:12px}
  .btn.pri{background:var(--accent);color:var(--accent-ink)}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .card.done .btn.pri{background:var(--card2);color:var(--text)}
  .tag{font-size:11px;font-weight:600;color:var(--accent);background:#26300f;border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:middle}
  .timer{position:fixed;left:0;right:0;bottom:0;background:#11140f;border-top:1px solid #2e3a17;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:none;z-index:20}
  .timer.show{display:block}
  .timer .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
  .timer .t{font:700 34px "Barlow Condensed";color:var(--accent);min-width:84px}
  .timer .l{flex:1;font-size:13px;color:var(--muted)}
  .timer button{border:0;background:var(--card2);color:var(--text);border-radius:10px;padding:10px 12px;font:600 13px Inter;cursor:pointer}
  .hist .card{padding:14px}
  .hist .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .hist .hd b{font-family:"Barlow Condensed";font-size:21px}
  .hist .hd span{font-size:12.5px;color:var(--muted);white-space:nowrap}
  .hist ul{list-style:none;padding:0;margin:10px 0 0}
  .hist li{font-size:13.5px;padding:6px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
  .hist li span:last-child{color:var(--muted);text-align:right}
  .empty{color:var(--muted);text-align:center;padding:40px 10px;font-size:14px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:30}
  .modal.show{display:flex}
  .modal .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;max-width:380px;width:100%}
  .modal h3{margin:0 0 6px;font-family:"Barlow Condensed";font-size:24px}
  .modal p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
  .modal .row{display:flex;gap:8px;margin-top:16px}
  .modal .row .btn{margin:0}
  .toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:99px;font:600 14px Inter;opacity:0;pointer-events:none;transition:opacity .25s;z-index:40;white-space:nowrap}
  .toast.show{opacity:1}
  header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .gear{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:10px;width:40px;height:40px;font-size:18px;cursor:pointer;flex:none}
  .pad{padding:16px}
  .h2{font-family:"Barlow Condensed";font-size:24px;margin:0 0 6px}
  .frm{display:flex;gap:10px}
  .frm label,label.full{flex:1;display:block;font-size:12px;color:var(--muted);margin-top:10px}
  .frm input,label.full input{display:block;width:100%;margin-top:4px;background:#0e1013;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:11px;font:500 15px Inter}
  .frm input:focus,label.full input:focus{outline:none;border-color:var(--accent)}
  .msg-err{color:#ff8a80}
  .msg-ok{color:var(--ok)}
  .kpi{display:flex;gap:10px;margin-bottom:10px}
  .kpi div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
  .kpi b{display:block;font:700 26px "Barlow Condensed"}
  .kpi span{font-size:12px;color:var(--muted)}
  .dn{color:var(--ok)} .upc{color:#ffb347}
  /* figura animada */
  .fg{stroke:#e6eaee;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .fg.tor{stroke-width:8}
  .fgw{stroke:#e6eaee;stroke-linecap:round}
  .fg2{stroke:#6c7581;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .hd{fill:#e6eaee}
  .eye{fill:#0a0c0f}
  .eqd{fill:#c8f03c}
  .eql{stroke:#c8f03c;stroke-linecap:round}
  .eqp{fill:none;stroke:#c8f03c;stroke-width:3.5}
  .cb{stroke:#c8f03c;opacity:.7}
  .pul{fill:#0a0c0f;stroke:#4a525d;stroke-width:2}
  .pp{fill:#3a4350}
  .pl{stroke:#3a4350;stroke-linecap:round;fill:none}
  .pf{stroke:#2a3039;stroke-linecap:round;fill:none}
  .pf2{fill:#2a3039}
  .fw{fill:none;stroke:#2a3039;stroke-width:5}
  .sh{fill:#000;opacity:.45}
  .gr{stroke:#262b33;stroke-width:2}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>MI RUTINA</h1>
      <div class="status" id="status">Cargando…</div>
    </div>
    <button class="gear" data-act="cfg" aria-label="Configuración">⚙️</button>
  </header>

  <div class="tabs">
    <button data-tab="hoy" class="on">Entrenar</button>
    <button data-tab="hist">Historial</button>
    <button data-tab="med">Medidas</button>
  </div>

  <div id="viewHoy"></div>
  <div id="viewHist" class="hist" style="display:none"></div>
  <div id="viewMed" class="hist" style="display:none"></div>
  <div id="viewSetup" style="display:none"></div>
</div>

<div class="timer" id="timer">
  <div class="in">
    <div class="t" id="tTime">0:00</div>
    <div class="l" id="tLbl">Descanso</div>
    <button id="tPlus">+30s</button>
    <button id="tSkip">Saltar</button>
  </div>
</div>

<div class="modal" id="modal">
  <div class="box">
    <h3 id="mTitle"></h3>
    <p id="mText"></p>
    <div class="row">
      <button class="btn ghost" id="mNo">Cancelar</button>
      <button class="btn pri" id="mYes">Aceptar</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   ANIMACIONES v2 — trayectorias + cinemática inversa
   ========================================================= */
const D2R = Math.PI/180;
const LN_ = {th:30, sh:29, ft:10, to:38, nk:15, ua:23, fa:21};
const r1 = n => Math.round(n*10)/10;
const vv = (a,l) => [l*Math.cos(a*D2R), -l*Math.sin(a*D2R)];
const ad = (p,v) => [p[0]+v[0], p[1]+v[1]];
const sc = (v,k) => [v[0]*k, v[1]*k];
const unit = (a,b) => { const dx=b[0]-a[0], dy=b[1]-a[1], d=Math.hypot(dx,dy)||1; return [dx/d, dy/d]; };
const pts = a => a.map(q => r1(q[0])+','+r1(q[1])).join(' ');
const PL = (a,c) => `<polyline points="${pts(a)}" class="${c}"/>`;
const LN = (x1,y1,x2,y2,w=5,c='pf') => `<line x1="${r1(x1)}" y1="${r1(y1)}" x2="${r1(x2)}" y2="${r1(y2)}" stroke-width="${w}" class="${c}"/>`;
const RC = (x,y,w,h,c='pp',rx=2) => `<rect x="${r1(x)}" y="${r1(y)}" width="${r1(w)}" height="${r1(h)}" rx="${rx}" class="${c}"/>`;
const CI = (x,y,r,c='pp') => `<circle cx="${r1(x)}" cy="${r1(y)}" r="${r}" class="${c}"/>`;
const PUL = (x,y) => CI(x,y,4.5,'pul');
const CAB = (W,x,y) => LN(W[0],W[1],x,y,1.6,'cb') + PUL(x,y);

// IK de dos segmentos: raíz R, objetivo T, preferencia de doblez (ángulo)
function ik(R,T,L1,L2,pref){
  const dx=T[0]-R[0], dy=T[1]-R[1], d0=Math.hypot(dx,dy)||0.001;
  const ux=dx/d0, uy=dy/d0;
  const d=Math.min(L1+L2-0.01, Math.max(Math.abs(L1-L2)+0.01, d0));
  const a=(L1*L1-L2*L2+d*d)/(2*d), h=Math.sqrt(Math.max(0, L1*L1-a*a));
  const bx=R[0]+ux*a, by=R[1]+uy*a;
  const px=Math.cos(pref*D2R), py=-Math.sin(pref*D2R);
  const s=((-uy)*px + ux*py) >= 0 ? 1 : -1;
  const M=[bx-uy*h*s, by+ux*h*s];
  const E=(d===d0) ? [T[0],T[1]] : [R[0]+ux*d, R[1]+uy*d];
  return [M,E];
}

/* ---------- equipamiento ---------- */
function EQ(W,eq){
  if(!eq || eq==='none' || !W) return '';
  const [x,y]=W;
  switch(eq){
    case 'bar':    return CI(x,y,10.5,'eqp') + CI(x,y,2.6,'eqd');
    case 'barS':   return CI(x,y,7,'eqp') + CI(x,y,2.2,'eqd');
    case 'db':     return RC(x-5,y-5,10,10,'eqd',2.5);
    case 'dbv':    return LN(x,y-7,x,y+7,3,'eql') + RC(x-4.5,y-11,9,5,'eqd',1.5) + RC(x-4.5,y+6,9,5,'eqd',1.5);
    case 'dbh':    return LN(x-7,y,x+7,y,3,'eql') + RC(x-11,y-4.5,5,9,'eqd',1.5) + RC(x+6,y-4.5,5,9,'eqd',1.5);
    case 'handle': return RC(x-2.5,y-5,5,10,'eqd',2);
    case 'rope':   return LN(x,y,x-3,y+8,3,'eql') + LN(x,y,x+3,y+8,3,'eql') + CI(x-3,y+9,2,'eqd') + CI(x+3,y+9,2,'eqd');
  }
  return '';
}

/* ---------- vista lateral ---------- */
function sideSolve(p){
  const j={}, P=p.P; j.P=P;
  const u=[Math.cos(p.to*D2R), -Math.sin(p.to*D2R)], n=[Math.sin(p.to*D2R), Math.cos(p.to*D2R)];
  j.u=u; j.n=n;
  const S=ad(P, sc(u,LN_.to)); j.S=S;
  const ha=p.to+(p.hd||0); j.ha=ha;
  j.H=ad(S, vv(ha, LN_.nk));
  const leg=(A,th,sh,kb,ft)=>{
    let K,Aa;
    if(A) [K,Aa]=ik(P,A,LN_.th,LN_.sh,kb==null?0:kb);
    else { K=ad(P,vv(th,LN_.th)); Aa=ad(K,vv(sh,LN_.sh)); }
    return [K, Aa, ad(Aa, vv(ft||0, LN_.ft))];
  };
  const arm=(W,Wr,Wt,ua,fa,eb,ebT)=>{
    let t=W;
    if(Wr) t=ad(S,Wr);
    if(Wt) t=ad(ad(S,sc(u,Wt[0])), sc(n,Wt[1]));
    const pref = ebT!=null ? p.to+ebT : (eb==null?270:eb);
    if(t) return ik(S,t,LN_.ua,LN_.fa,pref);
    const E=ad(S,vv(ua,LN_.ua)); return [E, ad(E,vv(fa,LN_.fa))];
  };
  [j.K,j.A,j.T]=leg(p.A,p.th,p.sh,p.kb,p.ft);
  [j.E,j.W]=arm(p.W,p.Wr,p.Wt,p.ua,p.fa,p.eb,p.ebT);
  if(p.A2 || p.th2!=null) [j.K2,j.A2,j.T2]=leg(p.A2,p.th2,p.sh2,p.kb2,p.ft2!=null?p.ft2:p.ft);
  if(p.W2 || p.Wr2 || p.Wt2 || p.ua2!=null) [j.E2,j.W2]=arm(p.W2,p.Wr2,p.Wt2,p.ua2,p.fa2,p.eb2,p.ebT2);
  return j;
}
function drawSide(p,pose,eq){
  const j=sideSolve(pose);
  let s='';
  if(!p.noShadow) s+=`<ellipse cx="${r1(j.P[0])}" cy="131" rx="30" ry="3" class="sh"/>`;
  if(p.back) s+= typeof p.back==='function' ? p.back(j,pose) : p.back;
  const off=p.farOff||[-3,-1.5], o=q=>[q[0]+off[0], q[1]+off[1]];
  // extremidades lejanas
  if(j.K2) s+=PL([j.P,j.K2,j.A2,j.T2],'fg2');
  else if(p.far!==false) s+=PL([j.P,j.K,j.A,j.T].map(o),'fg2');
  if(j.E2 && !p.arm2Near) s+=PL([j.S,j.E2,j.W2],'fg2');
  else if(!j.E2 && p.far!==false){ s+=PL([j.S,j.E,j.W].map(o),'fg2'); if(eq && eq!=='bar' && eq!=='rope') s+='<g opacity=".4">'+EQ(o(j.W),eq)+'</g>'; }
  // tronco (con curvatura opcional)
  if(pose.cv){
    const m=[(j.P[0]+j.S[0])/2 - j.n[0]*pose.cv, (j.P[1]+j.S[1])/2 - j.n[1]*pose.cv];
    s+=`<path d="M${r1(j.P[0])} ${r1(j.P[1])} Q${r1(m[0])} ${r1(m[1])} ${r1(j.S[0])} ${r1(j.S[1])}" class="fg tor"/>`;
  } else s+=PL([j.P,j.S],'fg tor');
  s+=PL([j.P,j.K,j.A,j.T],'fg');
  // cuello y cabeza
  s+=PL([j.S, ad(j.S, vv(j.ha,7))],'fg');
  s+=CI(j.H[0],j.H[1],8.5,'hd');
  if(!p.noEye){
    const f=p.face||1, nh=[Math.sin(j.ha*D2R)*f, Math.cos(j.ha*D2R)*f], uh=vv(j.ha,1);
    const e=ad(ad(j.H, sc(nh,4)), sc(uh,1.5));
    s+=CI(e[0],e[1],1.4,'eye');
  }
  if(p.cable) s+=CAB(j.W, p.cable[0], p.cable[1]);
  s+=PL([j.S,j.E,j.W],'fg') + CI(j.W[0],j.W[1],3.2,'hd');
  if(j.E2 && p.arm2Near) s+=PL([j.S,j.E2,j.W2],'fg') + CI(j.W2[0],j.W2[1],3.2,'hd');
  s+=EQ(j.W,eq);
  if(p.front) s+= typeof p.front==='function' ? p.front(j,pose) : p.front;
  return s;
}

/* ---------- vista de frente ---------- */
function drawFront(p,pose,eq){
  const cx=100; let s='';
  if(!p.lying) s+=`<ellipse cx="100" cy="131" rx="30" ry="3" class="sh"/>`;
  if(p.back) s+= typeof p.back==='function' ? p.back(pose) : p.back;
  const H=[cx,22], N=[cx,32], Sr=[cx+14,40], Sl=[cx-14,40], Hr=[cx+8,80], Hl=[cx-8,80], M=[cx,80];
  const legs = p.seated
    ? [[Hr,[cx+12,90],[cx+13,124],[cx+18,125]], [Hl,[cx-12,90],[cx-13,124],[cx-18,125]]]
    : [[Hr,[cx+10,104],[cx+11,126],[cx+17,127]], [Hl,[cx-10,104],[cx-11,126],[cx-17,127]]];
  legs.forEach(l => s+=PL(l,'fg'));
  s+=PL([Hl,Hr],'fg') + PL([N,M],'fg tor') + PL([Sl,Sr],'fg');
  s+=PL([N,[cx,26]],'fg') + CI(H[0],H[1],8.5,'hd') + (p.noEyes?'':CI(cx-3,21,1.3,'eye') + CI(cx+3,21,1.3,'eye'));
  const J={};
  [[1,'r',Sr],[-1,'l',Sl]].forEach(([sg,k,S])=>{
    const L=k==='l';
    const abd=(L && pose.abdL!=null) ? pose.abdL : pose.abd;
    const el =(L && pose.elL!=null)  ? pose.elL  : pose.el;
    const h  =(L && pose.hL!=null)   ? pose.hL   : pose.h;
    const fp = pose.fp!=null ? pose.fp : 1;
    const a=abd*D2R, a2=(abd+el)*D2R, ch=Math.cos(h*D2R);
    const E=[S[0]+sg*23*Math.sin(a)*ch, S[1]+23*Math.cos(a)];
    const W=[E[0]+sg*21*fp*Math.sin(a2)*ch, E[1]+21*fp*Math.cos(a2)];
    J['E'+k]=E; J['W'+k]=W;
    s+=PL([S,E,W],'fg') + CI(W[0],W[1],3.2,'hd');
  });
  if(p.fcable) p.fcable.forEach((c,i)=>{ s+=CAB(i===0?J.Wl:J.Wr, c[0], c[1]); });
  if(p.fcableR) s+=CAB(J.Wr, p.fcableR[0], p.fcableR[1]);
  if(p.over) s+=p.over(J);
  s+=EQ(J.Wr,eq) + EQ(J.Wl,eq);
  return s;
}

function drawTop(p,pose,eq){
  let s='';
  if(p.back) s+= typeof p.back==='function' ? p.back(pose) : p.back;
  const SR=[116,70], SL=[84,70], J={SR,SL};
  const mir=q=>[200-q[0], q[1]];
  const side=(S,ER,WR,pref)=>{
    let E,W;
    if(ER){ E=ER; W=null; } else [E,W]=ik(S,WR,23,21,pref);
    return [E,W];
  };
  const prefL = 180-(pose.ebR||0);
  [J.ER,J.WR]=side(SR, pose.ER, pose.WR, pose.ebR||0);
  [J.EL,J.WL]=side(SL, pose.ER?mir(pose.ER):null, pose.WR?mir(pose.WR):null, prefL);
  const arm=(S,E,W)=> PL(W?[S,E,W]:[S,E],'fg') + (W?CI(W[0],W[1],3.2,'hd'):'');
  s+=arm(SR,J.ER,J.WR) + arm(SL,J.EL,J.WL);
  if(p.cableMid && J.WR) s+=CAB([(J.WR[0]+J.WL[0])/2,(J.WR[1]+J.WL[1])/2], p.cableMid[0], p.cableMid[1]);
  s+=`<line x1="${SL[0]}" y1="${SL[1]}" x2="${SR[0]}" y2="${SR[1]}" stroke-width="13" class="fgw"/>`;

}

function lerpPose(a,b,t){
  const o={};
  for(const k in a){
    const x=a[k], y=b[k];
    if(Array.isArray(x)) o[k]=[x[0]+(y[0]-x[0])*t, x[1]+(y[1]-x[1])*t];
    else if(typeof x==='number' && typeof y==='number') o[k]=x+(y-x)*t;
    else o[k]=x;
  }
  return o;
}
const easeIO = x => 0.5-0.5*Math.cos(Math.PI*x);
// progreso 0..1 dentro del ciclo: pausa, ida, pausa, vuelta
function progressAt(p, x){
  if(p.fn) return x;
  const tm=p.tm||[0.14,0.36,0.14,0.42], tot=tm[0]+tm[1]+tm[2]+tm[3];
  let q=x*tot;
  if(q<tm[0]) return 0; q-=tm[0];
  if(q<tm[1]) return easeIO(q/tm[1]); q-=tm[1];
  if(q<tm[2]) return 1; q-=tm[2];
  return 1-easeIO(Math.min(1,q/tm[3]));
}
function drawPat(p, eq, t){
  const pose = p.fn ? p.fn(t) : lerpPose(p.a, p.b, t);
  const e = eq || p.eq;
  let s = `<line x1="0" y1="130" x2="200" y2="130" class="gr"/>`;
  if(p.v==='front') return s + drawFront(p,pose,e);
  if(p.v==='top') return drawTop(p,pose,e);
  return s + drawSide(p,pose,e);
}
const viewLabel = p => ({arriba:'vista desde arriba', frente:'vista de frente', espaldas:'vista de espaldas'})[p.view] || 'vista lateral';

const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function animLoop(now){
  document.querySelectorAll('.demo').forEach(el => {
    if(el.offsetParent===null) return;
    const p = PAT[el.dataset.pat]; if(!p) return;
    const dur = p.dur || 3000, x = (now % dur) / dur;
    const t = reduceMotion ? (p.fn ? 0 : 1) : progressAt(p, x);
    el.querySelector('g').innerHTML = drawPat(p, el.dataset.eq, t);
  });
  requestAnimationFrame(animLoop);
}

   ========================================================= */
const LS_KEY = 'rutina-bruno-pwa-v1', CFG_KEY = 'rutina-bruno-cfg', OUT_KEY = 'rutina-bruno-outbox';
let S = {next:'1', current:null, history:[], medidas:[]};
let cfg = null, outbox = [], syncState = 'idle', syncErr = '';
const open = new Set();
let tab = 'hoy';

const clone = o => JSON.parse(JSON.stringify(o));
const $ = s => document.querySelector(s);

function normalize(){ if(!R[S.next]) S.next = '1'; if(S.current && !R[S.current.routine]) S.current = null; }
function loadLocal(){
  try{ const raw = localStorage.getItem(LS_KEY); if(raw){ const d = JSON.parse(raw); S.next = d.next||'1'; S.current = d.current||null; S.history = d.history||[]; S.medidas = d.medidas||[]; } }catch(e){}
  try{ cfg = JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); }catch(e){ cfg = null; }
  try{ outbox = JSON.parse(localStorage.getItem(OUT_KEY) || '[]'); }catch(e){ outbox = []; }
  normalize();
}
function saveLocal(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({next:S.next, current:S.current, history:S.history.slice(0,60), medidas:S.medidas.slice(0,300)}));
    localStorage.setItem(OUT_KEY, JSON.stringify(outbox));
  }catch(e){}
}

/* ---------- conexión con la planilla (Apps Script) ---------- */
async function api(body, conf){
  const c = conf || cfg;
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 25000);
  try{
    const r = await fetch(c.url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(Object.assign({}, body, {clave:c.clave})), signal: ctl.signal});
    let j;
    try{ j = await r.json(); }catch(e){ throw new Error('respuesta inválida (¿la URL es la de /exec?)'); }
    if(!j.ok) throw new Error(j.error || 'error');
    return j;
  }catch(e){
    if(e.name==='AbortError') throw new Error('sin respuesta');
    if(e instanceof TypeError) throw new Error('sin conexión');
    throw e;
  }finally{ clearTimeout(to); }
}
let stateDirty = false, saveT = null, flushing = false, retryT = null;
function scheduleSave(){ saveLocal(); stateDirty = true; clearTimeout(saveT); saveT = setTimeout(flush, 1500); }
function queue(item){ outbox.push(item); saveLocal(); flush(); }
async function flush(){
  if(!cfg || flushing) return;
  flushing = true; setStatus('sync');
  try{
    while(outbox.length){ await api(outbox[0]); outbox.shift(); saveLocal(); }
    if(stateDirty){ stateDirty = false; await api({accion:'estado', estado:{next:S.next, current:S.current||null}}); }
    syncState = 'ok'; syncErr = '';
  }catch(e){
    syncState = 'err'; syncErr = e.message || String(e); stateDirty = true;
    clearTimeout(retryT); retryT = setTimeout(flush, 30000);
  }
  flushing = false; setStatus();
  if(syncState==='ok' && (outbox.length || stateDirty)) setTimeout(flush, 800);
}
function pendingCount(){ return outbox.length + (stateDirty ? 1 : 0); }
function setStatus(m){
  const el = $('#status');
  if(!cfg){ el.innerHTML = '⚙️ Falta conectar tu planilla'; return; }
  if(m==='sync'){ el.innerHTML = '🔄 Sincronizando…'; return; }
  if(syncState==='err'){
    el.innerHTML = syncErr==='sin conexión'
      ? `📴 Sin conexión · ${pendingCount()} cambio(s) guardado(s) en el celu, se suben solos`
      : `⚠️ No se pudo sincronizar (${esc(syncErr)}). Reintento automático.`;
    return;
  }
  el.innerHTML = '☁️ <b>Sincronizado</b> con tu planilla de Google';
}
function touch(){ if(S.current && !S.current.t0) S.current.t0 = Date.now(); }
function newSession(r){
  const items = {};
  R[r].slots.forEach(sl => { items[sl.id] = {opt:0, done:false, sets: sl.cardio ? [] : Array.from({length:sl.sets}, () => ({kg:'', r:'', ok:false}))}; });
  return {routine:r, started:Date.now(), items};
}
function ensureCurrent(){
  normalize();
  if(!S.current) S.current = newSession(S.next);
  R[S.current.routine].slots.forEach(sl => {
    if(!S.current.items[sl.id]) S.current.items[sl.id] = {opt:0, done:false, sets: sl.cardio?[]:Array.from({length:sl.sets},()=>({kg:'',r:'',ok:false}))};
  });
}

/* =========================================================
   AYUDAS
   ========================================================= */
function topOf(reps){ const nums = String(reps).match(/\d+/g); return nums ? +nums[nums.length-1] : null; }
function lastFor(vid){
  for(const s of S.history) for(const it of (s.items||[]))
    if(it.v === vid && it.sets && it.sets.some(x => x.kg!=='' || x.r!=='')) return {sets:it.sets, ts:s.ts};
  return null;
}
function fmtSets(sets, unit){
  const w = sets.filter(x=>x.kg!=='' || x.r!=='');
  if(!w.length) return '';
  const kgs = [...new Set(w.map(x=>x.kg))], reps = w.map(x=>x.r||'–').join(', '), u = unit==='seg' ? ' s' : '';
  if(kgs.length===1 && kgs[0]!=='') return kgs[0]+' kg × '+reps+u;
  if(kgs.length===1) return reps+u;
  return w.map(x=>(x.kg!==''?x.kg+'kg×':'')+(x.r||'–')).join(' · ')+u;
}
const fmtDate = ts => new Date(ts).toLocaleDateString('es-UY',{weekday:'short', day:'numeric', month:'short'});
const unitLabel = v => v.unit==='seg' ? 'seg' : (v.unit==='lado' ? 'reps/lado' : 'reps');
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function render(){
  ensureCurrent();
  const t = !cfg ? 'setup' : tab;
  const views = {hoy:'#viewHoy', hist:'#viewHist', med:'#viewMed', setup:'#viewSetup'};
  Object.entries(views).forEach(([k,sel]) => { $(sel).style.display = (k===t) ? '' : 'none'; });
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab===t));
  $('.tabs').style.display = cfg ? '' : 'none';
  if(t==='hoy') renderHoy(); else if(t==='hist') renderHist(); else if(t==='med') renderMed(); else renderSetup();
}

function avgPeso(desde, hasta){
  const xs = S.medidas.filter(m => m.peso!=='' && m.peso!=null && !isNaN(+m.peso) && m.fecha>=desde && m.fecha<hasta).map(m=>+m.peso);
  return xs.length ? xs.reduce((a,b)=>a+b,0)/xs.length : null;
}
function renderMed(){
  const now = Date.now(), D = 86400000;
  const a1 = avgPeso(now-7*D, now+D), a0 = avgPeso(now-14*D, now-7*D);
  const cint = S.medidas.filter(m => m.cintura!=='' && m.cintura!=null && !isNaN(+m.cintura));
  const lastPeso = S.medidas.find(m => m.peso!=='' && m.peso!=null);
  let kpi = '';
  if(a1!=null || cint.length){
    const dP = (a1!=null && a0!=null) ? a1-a0 : null;
    const dC = cint.length>1 ? (+cint[0].cintura) - (+cint[cint.length-1].cintura) : null;
    kpi = `<div class="kpi">
      <div><span>Peso promedio · últimos 7 días</span><b>${a1!=null?a1.toFixed(1)+' kg':'–'}</b>${dP!=null?`<span class="${dP<=0?'dn':'upc'}">${dP>0?'+':''}${dP.toFixed(1)} kg vs semana anterior</span>`:''}</div>
      <div><span>Cintura · última</span><b>${cint.length?(+cint[0].cintura).toFixed(1)+' cm':'–'}</b>${dC!=null?`<span class="${dC<=0?'dn':'upc'}">${dC>0?'+':''}${dC.toFixed(1)} cm desde el inicio</span>`:''}</div>
    </div>`;
  }
  const lista = S.medidas.length ? S.medidas.slice(0,40).map(m => `<li><span>${fmtDate(m.fecha)}${m.nota?' · '+esc(m.nota):''}</span><span>${m.peso!==''&&m.peso!=null?esc(m.peso)+' kg':''}${m.cintura!==''&&m.cintura!=null?' · '+esc(m.cintura)+' cm':''}</span></li>`).join('')
    : '<li><span>Todavía no anotaste medidas.</span><span></span></li>';
  $('#viewMed').innerHTML = kpi + `<div class="card pad">
      <div class="sub" style="margin-top:0">Nueva medida</div>
      <div class="frm">
        <label>Peso (kg)<input id="mPeso" inputmode="decimal" placeholder="${lastPeso?esc(lastPeso.peso):'74'}"></label>
        <label>Cintura (cm)<input id="mCint" inputmode="decimal" placeholder="opcional"></label>
      </div>
      <label class="full">Nota<input id="mNota" placeholder="opcional (ej. después de entrenar)"></label>
      <button class="btn pri" data-act="saveMed">Guardar medida</button>
      <div class="hint">Pesate 2 o 3 mañanas por semana, en ayunas, y mirá el promedio. La cintura, cada 2 semanas a la altura del ombligo.</div>
    </div>
    <div class="card"><div class="hd" style="padding:14px 14px 0"><b>Historial de medidas</b></div><ul style="padding:0 14px 6px">${lista}</ul></div>`;
}

function renderHoy(){
  const cur = S.current, rdef = R[cur.routine];
  const counted = rdef.slots;
  const doneN = counted.filter(s=>cur.items[s.id].done).length;
  const pct = Math.round(doneN / counted.length * 100);

  let h = `<div class="hero">
    <div class="lbl">Hoy te toca</div>
    <div class="big">DÍA <span>${cur.routine}</span></div>
    <div class="dname">${esc(rdef.name)}</div>
    <div class="seg">${ORDER.map(r=>`<button data-act="routine" data-r="${r}" class="${cur.routine===r?'on':''}">Día ${r}</button>`).join('')}</div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="prog">${doneN} de ${counted.length} completados</div>
  </div>`;

  rdef.slots.forEach(sl => {
    const it = cur.items[sl.id];
    const vid = sl.opts[it.opt] || sl.opts[0];
    const v = V[vid];
    const reps = v.reps || sl.reps;
    const isOpen = open.has(sl.id);
    const last = sl.cardio ? null : lastFor(vid);
    const lastTxt = last ? fmtSets(last.sets, v.unit) : '';
    const meta = sl.cardio ? reps : `${sl.sets} × ${reps} · ${sl.restTxt}`;

    h += `<div class="card ${it.done?'done':''} ${isOpen?'open':''}">
      <div class="chead" data-act="toggle" data-slot="${sl.id}">
        <div class="num">${it.done?'✓':sl.tag}</div>
        <div class="ctitle">
          <div class="n">${esc(v.name)}${sl.cardio?'<span class="tag">Cardio</span>':''}</div>
          <div class="m">${meta}</div>
          ${lastTxt?`<div class="last">Última vez: ${esc(lastTxt)}</div>`:''}
        </div>
        <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div class="cbody">`;
    if(isOpen){
      h += `<div class="demo" data-pat="${v.pat}" data-eq="${v.eq||''}"><svg viewBox="0 -12 200 146" role="img" aria-label="Animación: ${esc(v.name)}"><g></g></svg><div class="cap">${PAT[v.pat]?viewLabel(PAT[v.pat]):''}</div></div>
        <div class="sub">Opciones (si está ocupado, elegí otra)</div>
        <div class="chips">${sl.opts.map((o,i)=>`<button class="chip ${i===it.opt?'on':''}" data-act="opt" data-slot="${sl.id}" data-i="${i}">${esc(V[o].name)}</button>`).join('')}</div>
        <div class="guide">
          <div class="mus">💪 ${esc(v.mus)}</div>
          <ol>${v.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
          ${v.tip?`<div class="tip">⚠️ ${esc(v.tip)}</div>`:''}
          <a class="vid" href="https://www.youtube.com/results?search_query=${encodeURIComponent('como hacer '+v.name+' tecnica')}" target="_blank" rel="noopener">▶ Ver videos de la técnica</a>
        </div>`;
      if(!sl.cardio){
        const top = topOf(reps);
        let upHint = '';
        if(last && v.unit!=='seg' && top){
          const full = last.sets.filter(x=>x.r!=='').length >= sl.sets && last.sets.every(x=>x.r==='' || +x.r >= top);
          if(full) upHint = `<div class="up">✅ La última vez llegaste al tope del rango: hoy subí el peso.</div>`;
        }
        h += `<div class="sub">Series</div>
          <table class="sets"><thead><tr><th></th><th>kg</th><th>${unitLabel(v)}</th><th></th></tr></thead><tbody>
          ${it.sets.map((st,i)=>{
            const ph = last && last.sets[i] ? last.sets[i] : null;
            return `<tr>
              <td class="sn">${i+1}</td>
              <td><input inputmode="decimal" data-slot="${sl.id}" data-i="${i}" data-f="kg" value="${esc(st.kg)}" placeholder="${ph&&ph.kg!==''?esc(ph.kg):'–'}"></td>
              <td><input inputmode="numeric" data-slot="${sl.id}" data-i="${i}" data-f="r" value="${esc(st.r)}" placeholder="${ph&&ph.r!==''?esc(ph.r):'–'}"></td>
              <td><button class="ck ${st.ok?'on':''}" data-act="set" data-slot="${sl.id}" data-i="${i}" aria-label="Serie hecha">✓</button></td>
            </tr>`;}).join('')}
          </tbody></table>
          <div class="hint">Tocá ✓ al terminar cada serie y arranca el descanso. Lo que se ve en gris es lo que hiciste la última vez.</div>
          ${upHint}`;
      }
      h += `<button class="btn pri" data-act="done" data-slot="${sl.id}">${it.done?'Desmarcar':'Marcar como completado'}</button>`;
    }
    h += `</div></div>`;
  });

  h += `<button class="btn pri" data-act="finish" style="margin-top:18px">Terminar sesión</button>
        <button class="btn ghost" data-act="reset">Reiniciar la sesión de hoy</button>`;
  $('#viewHoy').innerHTML = h;
}

function renderHist(){
  if(!S.history.length){ $('#viewHist').innerHTML = '<div class="empty">Todavía no terminaste ninguna sesión.<br>Cuando termines la primera, aparece acá.</div>'; return; }
  $('#viewHist').innerHTML = S.history.map(s => {
    const items = (s.items||[]).filter(it => it.done || (it.sets && it.sets.some(x=>x.kg!==''||x.r!=='')));
    return `<div class="card">
      <div class="hd"><b>${esc(dayLabel(s.routine))}</b><span>${fmtDate(s.ts)}</span></div>
      <ul>${items.map(it=>`<li><span>${it.done?'✓ ':''}${esc(it.name)}</span><span>${esc(fmtSets(it.sets||[], it.unit)||'')}</span></li>`).join('') || '<li><span>Sin ejercicios registrados</span><span></span></li>'}</ul>
    </div>`;
  }).join('');
}

/* =========================================================
   EVENTOS
   ========================================================= */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act, sid = b.dataset.slot, cur = S.current;
  if(act==='cfg'){ tab='setup'; render(); return; }
  if(act==='closeCfg'){ tab='hoy'; render(); return; }
  if(act==='saveCfg'){
    const url = $('#cUrl').value.trim(), clave = $('#cKey').value.trim(), msg = $('#cMsg');
    if(!/^https:\/\/script\.google\.com\/.+\/exec/.test(url)){ msg.className='hint msg-err'; msg.textContent='La URL tiene que empezar con https://script.google.com/ y terminar en /exec'; return; }
    msg.className='hint'; msg.textContent='Probando conexión…';
    try{
      await api({accion:'cargar'}, {url, clave});
      cfg = {url, clave}; try{ localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }catch(e){}
      tab = 'hoy'; toast('¡Conectado con tu planilla!'); await connect();
    }catch(e){ msg.className='hint msg-err'; msg.textContent='No se pudo conectar: '+e.message; }
    return;
  }
  if(act==='saveMed'){
    const peso = $('#mPeso').value.replace(',', '.').trim(), cin = $('#mCint').value.replace(',', '.').trim(), nota = $('#mNota').value.trim();
    if((peso==='' || isNaN(+peso)) && (cin==='' || isNaN(+cin))){ toast('Anotá el peso o la cintura'); return; }
    const m = {id:'m'+Date.now(), fecha:Date.now(), peso: (peso!==''&&!isNaN(+peso))?+peso:'', cintura:(cin!==''&&!isNaN(+cin))?+cin:'', nota};
    S.medidas.unshift(m); queue({accion:'medida', medida:m}); render(); toast('Medida guardada');
    return;
  }
  if(act==='toggle'){ open.has(sid) ? open.delete(sid) : open.add(sid); render(); return; }
  if(act==='opt'){ cur.items[sid].opt = +b.dataset.i; scheduleSave(); render(); return; }
  if(act==='set'){
    touch();
    const it = cur.items[sid], i = +b.dataset.i;
    it.sets[i].ok = !it.sets[i].ok;
    const sl = R[cur.routine].slots.find(s=>s.id===sid);
    if(it.sets[i].ok){
      if(it.sets.every(x=>x.ok)){ it.done = true; open.delete(sid); toast('¡Ejercicio completado! 💪'); }
      else startRest(sl.rest, V[sl.opts[it.opt]].name);
    } else it.done = false;
    scheduleSave(); render(); return;
  }
  if(act==='done'){
    touch();
    const it = cur.items[sid]; it.done = !it.done;
    if(it.done){ open.delete(sid); it.sets.forEach(x=>{ if(x.kg!==''||x.r!=='') x.ok=true; }); }
    scheduleSave(); render(); return;
  }
  if(act==='routine'){
    const r = b.dataset.r; if(r===cur.routine) return;
    if(hasData(cur) && !(await ask('¿Cambiar de día?', 'Se va a borrar lo que anotaste hoy en el Día '+cur.routine+'.', 'Cambiar'))) return;
    S.current = newSession(r); open.clear(); scheduleSave(); render(); return;
  }
  if(act==='reset'){
    if(!(await ask('¿Reiniciar la sesión?', 'Se borra lo que anotaste hoy. El historial no se toca.', 'Reiniciar'))) return;
    S.current = newSession(cur.routine); open.clear(); scheduleSave(); render(); return;
  }
  if(act==='finish'){
    if(!hasData(cur)){ toast('Todavía no anotaste nada'); return; }
    const nx = nextOf(cur.routine);
    const pend = R[cur.routine].slots.filter(s=>!cur.items[s.id].done).length;
    const msg = (pend ? `Te faltan ${pend} ejercicio(s), pero se guarda igual lo que hiciste. ` : '¡Completaste todo! ') + `La próxima vez te toca el Día ${nx}: ${R[nx].name}.`;
    if(!(await ask('¿Terminar la sesión?', msg, 'Terminar'))) return;
    await finish(); return;
  }
});
document.addEventListener('input', e => {
  const t = e.target; if(!t.matches('.sets input')) return;
  touch();
  S.current.items[t.dataset.slot].sets[+t.dataset.i][t.dataset.f] = t.value.replace(',', '.').trim();
  scheduleSave();
});
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); window.scrollTo({top:0}); });

function hasData(cur){ return Object.values(cur.items).some(it => it.done || (it.sets||[]).some(x=>x.kg!==''||x.r!==''||x.ok)); }

async function finish(){
  const cur = S.current, rdef = R[cur.routine], ts = Date.now();
  const rec = {id:'s'+ts, routine:cur.routine, dayName:rdef.name, started:cur.t0||ts, ts, items: rdef.slots.map(sl => {
    const it = cur.items[sl.id], vid = sl.opts[it.opt]||sl.opts[0];
    return {slot:sl.id, v:vid, name:V[vid].name, unit:V[vid].unit||'reps', done:!!it.done,
            sets:(it.sets||[]).filter(x=>x.kg!==''||x.r!=='').map(x=>({kg:x.kg, r:x.r}))};
  })};
  S.history.unshift(rec);
  S.next = nextOf(cur.routine);
  S.current = newSession(S.next);
  open.clear(); stopRest();
  stateDirty = false;
  queue({accion:'terminar', sesion:rec, estado:{next:S.next, current:S.current}});
  render(); window.scrollTo({top:0, behavior:'smooth'});
  toast('¡Sesión guardada! Próximo: Día '+S.next);
}

/* ---------- modal / toast ---------- */
function ask(title, text, yes){
  return new Promise(res => {
    $('#mTitle').textContent = title; $('#mText').textContent = text; $('#mYes').textContent = yes||'Aceptar';
    $('#modal').classList.add('show');
    const done = v => { $('#modal').classList.remove('show'); $('#mYes').onclick = $('#mNo').onclick = null; res(v); };
    $('#mYes').onclick = () => done(true); $('#mNo').onclick = () => done(false);
  });
}
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'), 2200); }

/* ---------- timer de descanso ---------- */
let tEnd=0, tInt=null;
function startRest(sec, name){
  tEnd = Date.now() + sec*1000;
  $('#tLbl').textContent = 'Descanso · ' + name;
  $('#timer').classList.add('show');
  clearInterval(tInt); tick(); tInt = setInterval(tick, 250);
}
function tick(){
  const left = Math.max(0, Math.round((tEnd - Date.now())/1000));
  $('#tTime').textContent = Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
  if(left<=0){ clearInterval(tInt); try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){} $('#tLbl').textContent='¡A la próxima serie!'; setTimeout(()=>{ if(Date.now()>=tEnd) stopRest(); }, 4000); }
}
function stopRest(){ clearInterval(tInt); $('#timer').classList.remove('show'); }
$('#tPlus').onclick = () => { tEnd = Math.max(tEnd, Date.now()) + 30000; clearInterval(tInt); tick(); tInt=setInterval(tick,250); };
$('#tSkip').onclick = stopRest;

/* ---------- carga desde la planilla ---------- */
async function connect(){
  if(!cfg){ setStatus(); render(); return; }
  setStatus('sync');
  try{
    const d = await api({accion:'cargar'});
    const pendSes = outbox.filter(x=>x.accion==='terminar').map(x=>x.sesion).reverse();
    const pendMed = outbox.filter(x=>x.accion==='medida').map(x=>x.medida).reverse();
    if(d.estado && !stateDirty && !outbox.length){ S.next = d.estado.next || '1'; S.current = d.estado.current || null; }
    else if(!d.estado) stateDirty = true;
    const seen = new Set();
    S.history = pendSes.concat(d.sesiones||[]).filter(x => x && !seen.has(x.id||x.ts) && seen.add(x.id||x.ts));
    const seenM = new Set();
    S.medidas = pendMed.concat(d.medidas||[]).filter(x => x && !seenM.has(x.id) && seenM.add(x.id));
    normalize(); syncState = 'ok'; syncErr = '';
    saveLocal(); setStatus(); render();
    if(outbox.length || stateDirty) flush();
  }catch(e){
    syncState = 'err'; syncErr = e.message || String(e); setStatus();
  }
}
window.addEventListener('online', () => { flush(); });
let lastLoad = 0;
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState==='visible' && cfg && Date.now()-lastLoad > 60000 && !document.activeElement.matches('input')){ lastLoad = Date.now(); connect(); }
});

/* ---------- inicio ---------- */
loadLocal();
// link de configuración: #c=<base64 de {url,clave}> (no viaja al servidor; se borra al leerlo)
try{
  if(location.hash.startsWith('#c=')){
    const c = JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(3)))));
    if(c && c.url && c.clave){ cfg = {url:c.url, clave:c.clave}; localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }
    history.replaceState(null, '', location.pathname + location.search);
  }
}catch(e){}
setStatus();
render();
lastLoad = Date.now();
connect();
if('serviceWorker' in navigator){ window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
